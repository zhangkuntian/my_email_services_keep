name: Playwright Browser Check

# blitz.cloud sleeps the app after ~15 minutes without a browser visit, and it
# refuses to wake for automated traffic: "automated requests also come from your
# network, and we do not wake an app for those on the free plan." A real browser
# CAN wake it by clicking the "Wake it up" button, which is what main.py does.
#
# One run = one browser visit. The job does NOT loop: cadence is controlled
# entirely from outside by POSTing to the workflow_dispatch endpoint (see
# README). That keeps each job short, so runs never pile up against the
# concurrency limit on a free account.
#
# The cron below is a backstop for when the external trigger is not configured
# or has stopped. GitHub's schedule event is best-effort (runs "can be delayed
# during periods of high loads" and "some queued jobs may be dropped"), so it is
# not the primary driver.
on:
  schedule:
    - cron: "*/5 * * * *"   # backstop only; the external trigger is the driver
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    # One visit plus install. Generous for a cold runner, far below the 6-hour
    # cap, and short enough that a stuck run cannot block the cadence.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright package
        run: pip install playwright

      # The browser download is the slow part of a cold run, so cache it. The key
      # carries the Playwright version: a different version expects a different
      # Chromium build, and reusing the old cache would fail at launch time.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(python -c "import playwright; print(playwright.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # A cache hit skips the ~170 MB download but the OS libraries still have to
      # be present, so install only the apt dependencies.
      - name: Install system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run browser check
        run: |
          set -uo pipefail
          echo "triggered by: $GITHUB_EVENT_NAME at $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          python main.py
