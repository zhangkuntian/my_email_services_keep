name: Blitz Wake

# blitz.cloud sleeps the app after ~15 minutes without a browser visit, and it
# refuses to wake for automated traffic: "automated requests also come from your
# network, and we do not wake an app for those on the free plan."
#
# The wake page also carries a Cloudflare Turnstile widget that gates the
# "Wake it up" button. Playwright cannot get past it: the challenge scores the
# automation control plane (Runtime.enable + Target.setAutoAttach) above every
# fingerprint signal, so the widget renders and then never issues a token.
#
# wake.mjs therefore drives a real fingerprint-chromium over raw CDP, never
# enabling a protocol domain, and lets the managed widget clear itself. Measured
# on this site from this machine: token in ~13s, zero widget clicks.
#
# One run = one visit. The job does NOT loop: cadence is controlled from outside
# by POSTing to the workflow_dispatch endpoint (see README). That keeps each job
# short, so runs never pile up against the concurrency limit on a free account.
#
# The cron below is a backstop for when the external trigger is not configured
# or has stopped. GitHub's schedule event is best-effort (runs "can be delayed
# during periods of high loads" and "some queued jobs may be dropped"), so it is
# not the primary driver.
on:
  schedule:
    - cron: "*/5 * * * *"   # backstop only; the external trigger is the driver
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: a browser version is itself an identity asset, and a silent bump
  # would change the fingerprint mid-flight.
  FP_VERSION: "150.0.7871.186"
  FP_TARBALL: "ungoogled-chromium-150.0.7871.186-1-x86_64_linux.tar.xz"

jobs:
  browser-check:
    runs-on: ubuntu-latest
    # One visit plus browser unpack. Generous for a cold runner, far below the
    # 6-hour cap, and short enough that a stuck run cannot block the cadence.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"   # Node >= 22 ships a global WebSocket; no npm deps

      # The browser download is the slow part of a cold run, so cache it.
      - name: Cache fingerprint-chromium
        id: fp-cache
        uses: actions/cache@v4
        with:
          path: /opt/fpchromium
          key: fpchromium-${{ runner.os }}-${{ env.FP_VERSION }}

      - name: Install fingerprint-chromium (cache miss)
        if: steps.fp-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/adryfish/fingerprint-chromium/releases/download/${FP_VERSION}/${FP_TARBALL}"
          curl -fsSL "$url" -o /tmp/fp.tar.xz
          mkdir -p /opt/fpchromium
          tar -xJf /tmp/fp.tar.xz -C /opt/fpchromium --strip-components=1
          chmod -R a+rx /opt/fpchromium
          /opt/fpchromium/chrome --version

      # The cache holds the binary but not the shared libraries it links against.
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 xz-utils

      - name: Run wake check
        env:
          BROWSER_BIN: /opt/fpchromium/chrome
        run: |
          set -uo pipefail
          echo "triggered by: $GITHUB_EVENT_NAME at $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          node wake.mjs
