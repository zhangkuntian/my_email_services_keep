name: Playwright Browser Check

# blitz.cloud sleeps the app after ~15 minutes without a browser visit, and it
# refuses to wake for automated traffic: "automated requests also come from your
# network, and we do not wake an app for those on the free plan." A real browser
# CAN wake it by clicking the "Wake it up" button, which is what main.py does.
#
# Goal: 24/7 coverage, one visit every 5 minutes.
#
# Why the cron is only a backstop:
# GitHub's schedule event is best-effort. Documented: runs "can be delayed during
# periods of high loads" and "some queued jobs may be dropped". Measured by
# others on public repos: workflows scheduled every 15 minutes fired on only 64%
# of their slots over 7 days, median start delay 7.4 minutes. A dropped or late
# run is a missed visit, and a missed visit lets the app sleep.
#
# So the real driver is an external trigger hitting workflow_dispatch every 5
# minutes (see README). The cron below only catches the case where that external
# trigger is not configured yet: it starts a job hourly, and each job loops
# internally for 3 hours with precise 5-minute sleeps that cannot drift.
on:
  schedule:
    - cron: "0 * * * *"   # backstop only; the external trigger is the driver
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group on purpose: runs must overlap so the 5-minute cadence is
# continuous across the hourly handoff. A concurrency group would serialize them
# and open a gap at every boundary.

jobs:
  browser-check:
    runs-on: ubuntu-latest
    # 36 checks x 5 min = 180 min of coverage, plus install and per-check time.
    # GitHub's hard cap is 6 hours per job; this stays well inside it.
    timeout-minutes: 210

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run browser check
        run: |
          set -uo pipefail
          echo "triggered by: $GITHUB_EVENT_NAME at $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          # 36 checks, 5 minutes apart = 180 minutes of coverage.
          for i in $(seq 1 36); do
            echo "::group::check $i of 36 at $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            python main.py || echo "::warning::check $i did not see a healthy page"
            echo "::endgroup::"
            if [ "$i" -lt 36 ]; then
              sleep 300
            fi
          done
